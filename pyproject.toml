[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-pipeline-kit"
version = "0.1.0"
description = "Reusable QA and routing components for AI-driven short-video content pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LanguidAI" }]
keywords = ["qa", "short-video", "content-pipeline", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["acpk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
